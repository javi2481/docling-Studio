# =============================================================================
# Docling Studio — MAX stack (local image + ingestion + graph + reasoning)
#
# Uses the published GHCR local image (no rebuild). Sidecars: OpenSearch,
# Neo4j, embedding. Reasoning talks to host Ollama via host.docker.internal.
#
# Usage:
#   docker compose -f docker-compose.max.yml --env-file .env.max up -d --build
#
# UI:        http://localhost:3000
# Neo4j:     http://localhost:7474  (neo4j / changeme)
# OpenSearch:http://localhost:9200
# Embedding: http://localhost:8001/health
# =============================================================================

services:
  neo4j:
    image: neo4j:5.15-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u $${NEO4J_USER:-neo4j} -p $${NEO4J_PASSWORD:-changeme} 'RETURN 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  embedding:
    build:
      context: ./embedding-service
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
        BAKE_MODEL: ${BAKE_MODEL:-false}
    ports:
      - "8001:8001"
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
    volumes:
      - embedding_hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 2g

  docling-studio:
    image: ghcr.io/scub-france/docling-studio:latest-local
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      DOCUMENT_TIMEOUT: ${DOCUMENT_TIMEOUT:-6600}
      LOCK_TIMEOUT: ${LOCK_TIMEOUT:-6900}
      CONVERSION_TIMEOUT: ${CONVERSION_TIMEOUT:-7200}
      MAX_CONCURRENT_ANALYSES: ${MAX_CONCURRENT_ANALYSES:-1}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-100}
      NGINX_MAX_BODY_SIZE: ${NGINX_MAX_BODY_SIZE:-200M}
      MAX_PAGE_COUNT: ${MAX_PAGE_COUNT:-0}
      BATCH_PAGE_SIZE: ${BATCH_PAGE_SIZE:-0}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-0}
      OPENSEARCH_URL: http://opensearch:9200
      EMBEDDING_URL: http://embedding:8001
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      STORE_SECRET_KEY: ${STORE_SECRET_KEY}
      REASONING_ENABLED: ${REASONING_ENABLED:-true}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      REASONING_MODEL_ID: ${REASONING_MODEL_ID:-qwen3-coder:30b}
      REASONING_MAX_ITERATIONS: ${REASONING_MAX_ITERATIONS:-8}
      LLM_PROVIDER_TYPE: ollama
      RAG_PIPELINE_ENABLED: "true"
      STUDIO_MODE_ENABLED: ${STUDIO_MODE_ENABLED:-true}
      INSPECT_MODE_ENABLED: "true"
      LINKED_MODE_ENABLED: "true"
    volumes:
      - docling_studio_uploads:/app/uploads
      - docling_studio_data:/app/data
      # Override baked UI so local frontend changes (e.g. default locale=en) apply
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      opensearch:
        condition: service_healthy
      embedding:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 10g

volumes:
  neo4j_data:
  neo4j_logs:
  opensearch_data:
  embedding_hf_cache:
  docling_studio_uploads:
  docling_studio_data:
